# GitHub Actions for GEOS
#
# Paul Ramsey <pramsey at cleverelephant dot ca>
# Based on AZP configuration by Mateusz Loskot <mateusz at loskot dot net>

name: 'CI'

on:
  push:
    paths-ignore:
      - 'web/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  #  to fetch code (actions/checkout)

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "300M"

jobs:
  linux:
    name: 'Linux'
    env:
      GEOS_INSTALL: ${{ github.workspace }}/inst
    strategy:
      fail-fast: false
      matrix:
        ci:
        - cxx_compiler: g++
          c_compiler: gcc
          build_type: Coverage
          library_type: shared
          cxxstd: 17
          packages: g++ lcov libbenchmark-dev
          cmake_extra: -D BUILD_BENCHMARKS=ON
          os: ubuntu-latest

          # gcc 9 and lower are not supported
          # in ubuntu 22.04 and higher

        - cxx_compiler: g++-10
          c_compiler: gcc-10
          build_type: Release
          library_type: shared
          cxxstd: 17
          packages: g++-10 gcc-10
          os: ubuntu-22.04

        - cxx_compiler: g++-11
          c_compiler: gcc-11
          build_type: Release
          library_type: static
          cxxstd: 17
          packages: g++-11 gcc-11
          os: ubuntu-22.04

        - cxx_compiler: g++-12
          c_compiler: gcc-12
          build_type: Release
          library_type: shared
          cxxstd: 20
          packages: g++-12 gcc-12
          os: ubuntu-22.04

          # gcc 12 and lower are not supported
          # in ubuntu 24.04 and higher

        - cxx_compiler: g++-13
          c_compiler: gcc-13
          build_type: Release
          library_type: static
          cxxstd: 20
          packages: g++-13 gcc-13
          os: ubuntu-24.04

        - cxx_compiler: g++-14
          c_compiler: gcc-14
          build_type: Debug
          library_type: shared
          cxxstd: 20
          packages: g++-14 gcc-14 valgrind
          os: ubuntu-24.04

          # clang 10 and lower are not supported
          # in ubuntu 22.04 and higher

        - cxx_compiler: clang++-12
          c_compiler: clang-12
          build_type: ASAN
          library_type: static
          cxxstd: 14
          packages: 'clang-12'
          os: ubuntu-22.04

        - cxx_compiler: clang++-13
          c_compiler: clang-13
          build_type: ASAN
          library_type: shared
          cxxstd: 17
          packages: 'clang-13'
          os: ubuntu-22.04

        - cxx_compiler: clang++-14
          c_compiler: clang-14
          build_type: ASAN
          library_type: static
          cxxstd: 20
          packages: 'clang-14'
          os: ubuntu-22.04

        - cxx_compiler: clang++-15
          c_compiler: clang-15
          build_type: ASAN
          library_type: shared
          cxxstd: 20
          packages: 'clang-15'
          os: ubuntu-22.04

          # clang 15 and lower are not supported
          # in ubuntu 24.04 and higher

        - cxx_compiler: clang++-16
          c_compiler: clang-16
          build_type: ASAN
          library_type: static
          cxxstd: 20
          packages: 'clang-16'
          os: ubuntu-24.04

        - cxx_compiler: clang++-17
          c_compiler: clang-17
          build_type: ASAN
          library_type: shared
          cxxstd: 20
          packages: 'clang-17'
          os: ubuntu-24.04

        - cxx_compiler: clang++-18
          c_compiler: clang-18
          build_type: ASAN
          library_type: static
          cxxstd: 20
          packages: 'clang-18'
          os: ubuntu-24.04

        - cxx_compiler: clang++-19
          c_compiler: clang-19
          build_type: Debug
          library_type: shared
          cxxstd: 20
          packages: clang-19 valgrind
          os: ubuntu-24.04

        - cxx_compiler: clang++-20
          c_compiler: clang-20
          build_type: Debug
          library_type: static
          cxxstd: 20
          packages: clang-20 valgrind
          os: ubuntu-24.04

          # clang 21 and lower are not supported
          # in ubuntu 26.04 and higher

        - cxx_compiler: clang++-21
          c_compiler: clang-21
          build_type: Debug
          library_type: shared
          cxxstd: 20
          packages: clang-21 valgrind
          os: ubuntu-26.04

        - cxx_compiler: clang++-22
          c_compiler: clang-22
          build_type: Debug
          library_type: static
          cxxstd: 20
          packages: clang-22 valgrind
          os: ubuntu-26.04


    runs-on: ${{ matrix.ci.os }}
    steps:

    - name: 'Install Dependencies'
      run: |
        set -e
        sudo -E apt-get update
        sudo -E apt-get autopurge -y needrestart
        sudo -E apt-get -yq --no-install-suggests --no-install-recommends install doxygen ccache ${{ matrix.ci.packages }}

    - name: Install CMake minimum required
      if: matrix.ci.c_compiler == 'gcc-10'
      run: |
        set -e
        cmake_minimum_required=3.15.4
        wget -q https://github.com/Kitware/CMake/releases/download/v${cmake_minimum_required}/cmake-${cmake_minimum_required}-Linux-x86_64.tar.gz
        mkdir -p $HOME/.local
        tar xf cmake-${cmake_minimum_required}-Linux-x86_64.tar.gz --strip-components=1 -C $HOME/.local
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - uses: actions/checkout@v7.0.1

    - name: Retrieve build cache
      uses: actions/cache/restore@v6.1.0
      id: restore-cache
      with:
        path: .ccache
        key: ${{ matrix.ci.os }}-${{ matrix.ci.build_type}}-${{ matrix.ci.library_type }}-${{ matrix.ci.cxx_compiler }}-${{ matrix.ci.cxxstd }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: ${{ matrix.ci.os }}-${{ matrix.ci.build_type}}-${{ matrix.ci.library_type }}-${{ matrix.ci.cxx_compiler }}-${{ matrix.ci.cxxstd }}

    - name: 'Build'
      run: |
        set -e
        which cmake
        cmake --version
        cmake --log-level VERBOSE ${{ matrix.ci.cmake_extra }} \
          -D CMAKE_BUILD_TYPE=${{ matrix.ci.build_type }} \
          -D BUILD_SHARED_LIBS=${{ matrix.ci.library_type == 'shared' && 'ON' || 'OFF' }} \
          -D CMAKE_C_COMPILER=${{ matrix.ci.c_compiler }} \
          -D CMAKE_CXX_COMPILER=${{ matrix.ci.cxx_compiler }} \
          -D CMAKE_CXX_STANDARD=${{ matrix.ci.cxxstd }} \
          -D CMAKE_INSTALL_PREFIX=$GEOS_INSTALL \
          -D BUILD_DOCUMENTATION=YES \
          -D USE_CCACHE=ON \
          -S . -B build
        cmake --build build -j $(nproc)
        cmake --build build --target docs
        ccache --show-stats

    - name: Save build cache
      uses: actions/cache/save@v6.1.0
      with:
        path: .ccache
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}

    - name: Test
      working-directory: ./build
      run: ctest --output-on-failure

    - name: Install
      run: cmake --install build

    # Run the all-unit-tests under
    # the memory checker when we have Debug symbols
    # available. Change to ^all to also check all-xml-tests
    - name: Valgrind
      if: matrix.ci.build_type == 'Debug'
      working-directory: ./build
      run: |
        ctest --output-on-failure \
          --overwrite MemoryCheckCommandOptions="--leak-check=full --error-exitcode=100 --num-callers=100" \
          -R ^all-unit -C Valgrind -T memcheck

    - name: 'Upload Valgrind Log'
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: valgrind-log
        path: build/Testing/Temporary/MemoryChecker.**.log
        retention-days: 1

    - name: Generate coverage report
      if: matrix.ci.build_type == 'Coverage'
      working-directory: ./build
      run: |
        lcov --ignore-errors=gcov,negative --capture --directory CMakeFiles --output-file coverage.info

    - name: Upload Coverage to Codecov
      if: ${{ matrix.ci.build_type == 'Coverage' && !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: false
        files: build/coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}

  windows-mingw:
    name: 'Windows (mingw-w64, x86_64, windows-2022)'
    env:
      GEOS_INSTALL: ${{ github.workspace }}\inst
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        build_type: ['Debug', 'Release']
        library_type: [shared, static]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: 'Setup'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install:  >-
          make
          mingw-w64-x86_64-ccache
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc

    - name: Retrieve build cache
      uses: actions/cache/restore@v6.1.0
      id: restore-cache
      with:
        path: .ccache
        key: windows-mingw-${{ matrix.build_type}}-${{ matrix.library_type}}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: windows-mingw-${{ matrix.build_type}}-${{ matrix.library_type}}

    - name: 'Build'
      env:
        CCACHE_DIR: ${{ github.workspace }}\.ccache
      run: |
        cmake --log-level VERBOSE \
          -G "MSYS Makefiles" \
          -D CMAKE_BUILD_TYPE=${{ matrix.build_type}} \
          -D BUILD_SHARED_LIBS=${{ matrix.library_type == 'shared' && 'ON' || 'OFF' }} \
          -D CMAKE_INSTALL_PREFIX=$GEOS_INSTALL \
          -D USE_CCACHE=ON \
          -S . -B build
        cmake --build build -j 4
        ccache --show-stats --verbose

    - name: Save build cache
      uses: actions/cache/save@v6.1.0
      with:
        path: .ccache
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}

    - name: 'Test'
      working-directory: ./build
      run: ctest --output-on-failure

    - name: Install
      run: cmake --install build

  windows-msvc-msbuild:
    name: Windows (MSVC MSBuild)
    env:
      GEOS_INSTALL: ${{ github.workspace }}\inst
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            generator: Visual Studio 17 2022
            arch: x64
            library_type: shared
          - os: windows-11-vs2026-arm
            generator: Visual Studio 18 2026
            arch: arm64
            library_type: static
  
    steps:
    - uses: actions/checkout@v7.0.1

    # ccache not supported for this generator and/or Debug

    - name: 'Build'
      shell: cmd
      run: |
        cmake --log-level VERBOSE ^
          -G "${{ matrix.generator }}" ^
          -A ${{ matrix.arch }} ^
          -D CMAKE_BUILD_TYPE=Debug ^
          -D CMAKE_INSTALL_PREFIX=%GEOS_INSTALL% ^
          -D CMAKE_CXX_STANDARD=17 ^
          -D BUILD_SHARED_LIBS=${{ matrix.library_type == 'shared' && 'ON' || 'OFF' }} ^
          -S . -B build
        IF %ERRORLEVEL% NEQ 0 exit /B 1
        cmake --build build --config Debug -j 4 -- /p:CL_MPcount=4

    - name: 'Test'
      working-directory: build
      run: ctest --output-on-failure -C Debug

    - name: Install
      run: cmake --install build --config Debug

  windows-msvc-ninja:
    name: Windows (MSVC Ninja)
    env:
      GEOS_INSTALL: ${{ github.workspace }}\inst
    strategy:
      fail-fast: false
      matrix:
        ci:
        - os: windows-2022
          library_type: shared
          cxxstd: 20
          arch: x64
        - os: windows-2025
          library_type: static
          cxxstd: 20
          arch: x64
        - os: windows-11-arm
          library_type: shared
          cxxstd: 20
          arch: arm64

    runs-on: ${{ matrix.ci.os }}
    steps:

    - uses: actions/checkout@v7.0.1

    - name: Retrieve build cache
      uses: actions/cache/restore@v6.1.0
      id: restore-cache
      with:
        path: .ccache
        key: msvc-ninja-${{ matrix.ci.os }}-${{ matrix.ci.library_type}}-${{ matrix.ci.cxxstd }}-${{ matrix.ci.arch }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: msvc-ninja-${{ matrix.ci.os }}-${{ matrix.ci.library_type}}-${{ matrix.ci.cxxstd }}-${{ matrix.ci.arch }}

    - name: 'Setup'
      run: choco install ccache ninja

    - name: Activate MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ matrix.ci.arch }}

    - name: 'Build'
      env:
        CCACHE_DIR: ${{ github.workspace }}\.ccache
      shell: cmd
      run: |
        cmake --log-level VERBOSE ^
          -G Ninja ^
          -D CMAKE_BUILD_TYPE=Release ^
          -D CMAKE_INSTALL_PREFIX=%GEOS_INSTALL% ^
          -D BUILD_SHARED_LIBS=${{ matrix.ci.library_type == 'shared' && 'ON' || 'OFF' }} ^
          -D CMAKE_CXX_STANDARD=${{ matrix.ci.cxxstd }} ^
          -D BUILD_SHARED_LIBS=ON ^
          -D USE_CCACHE=ON ^
          -S . -B build
        IF %ERRORLEVEL% NEQ 0 exit /B 1
        cmake --build build -j 4
        IF %ERRORLEVEL% NEQ 0 exit /B 1
        ccache --show-stats --verbose

    - name: Save build cache
      uses: actions/cache/save@v6.1.0
      with:
        path: .ccache
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}

    - name: 'Test'
      working-directory: build
      run: ctest --output-on-failure

    - name: Install
      run: cmake --install build

  macos:
    name: 'macOS clang'
    env:
      GEOS_INSTALL: ${{ github.workspace }}/inst
    strategy:
      fail-fast: false
      matrix:
        include:
        - xcode: "15.4"
          cxxstd: 20
          build_type: Release
          library_type: shared
          runs_on: macos-14
        - xcode: "16.4"
          cxxstd: 23
          build_type: Debug
          library_type: shared
          runs_on: macos-15
        - xcode: "26.0"
          cxxstd: 23
          build_type: Release
          library_type: static
          runs_on: macos-26

    runs-on: ${{ matrix.runs_on }}
    steps:

    - name: 'Setup'
      run: brew install ccache

    - name: 'Install'
      env:
        XCODE_APP: /Applications/XCode_${{ matrix.xcode }}.app
      run: |
        set -e
        uname -a
        sudo xcode-select -switch ${XCODE_APP}
        which clang++
        clang++ --version

    - uses: actions/checkout@v7.0.1

    - name: Retrieve build cache
      uses: actions/cache/restore@v6.1.0
      id: restore-cache
      with:
        path: .ccache
        key: ${{ runner.os }}-${{ matrix.xcode }}-${{ matrix.build_type}}-${{ matrix.library_type}}-${{ matrix.cxxstd }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: ${{ runner.os }}-${{ matrix.xcode }}-${{ matrix.build_type}}-${{ matrix.library_type}}-${{ matrix.cxxstd }}

    - name: 'Build'
      run: |
        set -e
        cmake --log-level VERBOSE \
          -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -D BUILD_SHARED_LIBS=${{ matrix.library_type == 'shared' && 'ON' || 'OFF' }} \
          -D CMAKE_INSTALL_PREFIX=$GEOS_INSTALL \
          -D CMAKE_CXX_STANDARD=${{ matrix.cxxstd }} \
          -D USE_CCACHE=ON \
          -S . -B build
        cmake --build build --config ${{ matrix.build_type }} -j 4
        ccache --show-stats

    - name: Save build cache
      uses: actions/cache/save@v6.1.0
      with:
        path: .ccache
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}

    - name: 'Test'
      working-directory: ./build
      run: ctest -V --output-on-failure -C ${{ matrix.build_type }}

    - name: Install
      run: cmake --install build --config ${{ matrix.build_type }}

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Retrieve build cache
      uses: actions/cache/restore@v6.1.0
      id: restore-cache
      with:
        path: .ccache
        key: freebsd-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: freebsd

    - name: Build, test, install
      uses: vmactions/freebsd-vm@v1.5.7
      with:
        release: "15.0"
        envs: CCACHE_COMPRESS CCACHE_COMPRESSLEVEL CCACHE_MAXSIZE
        usesh: true
        prepare: |
          pkg install -y cmake ccache
        run: |
          set -e
          export CCACHE_DIR=$PWD/.ccache
          cmake --log-level VERBOSE \
            -D CMAKE_INSTALL_PREFIX=/tmp/inst \
            -D USE_CCACHE=ON \
            -S . -B build
          cmake --build build -j $(nproc)
          ccache --show-stats
          ctest --test-dir build --output-on-failure
          cmake --install build
          rm -rf build
          rm -rf /tmp/inst

    - name: Save build cache
      uses: actions/cache/save@v6.1.0
      with:
        path: .ccache
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}

  emscripten:
    name: Emscripten WASM build
    runs-on: ubuntu-latest
    steps:
    - name: Install
      run: |
        set -e
        sudo -E apt-get update
        sudo -E apt-get autopurge -y needrestart
        sudo -E apt-get -yq --no-install-suggests --no-install-recommends install emscripten ccache

    - uses: actions/checkout@v7.0.1

    - name: Retrieve build cache
      uses: actions/cache/restore@v6.1.0
      id: restore-cache
      with:
        path: .ccache
        key: emscripten-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: emscripten

    - name: Build
      run: |
        set -e
        emcmake cmake --log-level VERBOSE \
          -D BUILD_SHARED_LIBS=OFF \
          -D USE_CCACHE=ON \
          -S . -B build
        cmake --build build -j $(nproc)
        ccache --show-stats

    - name: Save build cache
      uses: actions/cache/save@v6.1.0
      with:
        path: .ccache
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}

#    - name: Test
#      working-directory: ./build
#      run: ctest --output-on-failure

  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
    - name: Install
      run: |
        set -e
        sudo -E apt-get update
        sudo -E apt-get -yq --no-install-suggests --no-install-recommends install cppcheck

    - uses: actions/checkout@v7.0.1

    - name: 'cppcheck'
      run: ./tools/cppcheck.sh

    - uses: codespell-project/actions-codespell@v2
      # false-positives can be added to tools/codespell.ignore

  cmake-subproject:
    name: 'CMake Subproject'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        path: geos

    - name: 'CMake Superbuild'
      run: |
        set -e
        cp geos/tests/superbuild.CMakeLists.txt ./CMakeLists.txt
        cp geos/examples/capi_read.c .
        cmake --log-level VERBOSE -S . -B build
        cmake --build build -j $(nproc)
        build/capi_read
        test ! -f build/geos/bin/test_geos_unit || { echo "Error: GEOS tests were built" 1>&2 ; exit 1; }

